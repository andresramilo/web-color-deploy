apiVersion: batch/v1
kind: Job
metadata:
  generateName: pre-sync-
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  template:
    spec:
      containers:
        - name: chamada
          image: curlimages/curl:latest
          command:
            - /bin/sh
            - -c
            - |
              curl -X POST -H "Content-Type: application/json \
              -d '{message: "Entrou em Pre Sync !!!"}' \
              https://webhook.site/2a980fe6-4eaf-4245-8060-a107c3198904
      restartPolicy: Never
---
